name: verify

# Runs the checks a contributor runs locally (README "Checks") on every push to
# main and every pull request. Nothing here needs network access beyond
# installing pinned tools; the dataset build and the verifier read only
# committed files.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Committed outputs match the curated inputs
        # hospitals.json, the evidence audit, the worklist and the count
        # sentences in the docs must be exactly what build-dataset.py produces,
        # so a hand edit the build would overwrite fails here. The build has no
        # clock: running it twice gives identical bytes.
        run: python3 scripts/build-dataset.py --check

      - name: Dataset integrity
        run: python3 scripts/verify-data.py

      - name: JavaScript syntax
        run: node --check core.js && node --check app.js

      - name: HTML validation
        run: npx --yes html-validate@8 index.html

      - name: JavaScript lint
        run: npx --yes eslint@9 core.js app.js tests

      - name: Unit tests
        run: node --test "tests/unit/*.test.js"

      - name: Leaflet is vendored, not loaded from a CDN
        # A CDN dependency means a blank map on networks that block third-party
        # hosts, which is routine inside hospitals.
        run: |
          if grep -qE 'src="https://(unpkg|cdnjs|cdn\.jsdelivr)[^"]*' index.html; then
            echo 'index.html loads a script from a CDN; use vendor/ instead.'
            exit 1
          fi
          test -f vendor/leaflet/leaflet.js
          test -f vendor/leaflet/leaflet.css

  e2e:
    # Headless browser smoke tests: lookup, detail, receiving center, modes,
    # share links, exports, accessibility (axe), keyboard and layout at 320–1920 px.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
